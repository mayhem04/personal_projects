<body>
    <div class="container">
        <h1>My Library</h1>
        
        <!-- Add Book Button -->
        <button id="showFormBtn">+ Add Book</button>

        <!-- Book Form (initially hidden) -->
        <form id="book-form" style="display: none;">
            <input type="text" id="title" placeholder="Book Title" required>
            <input type="text" id="author" placeholder="Author" required>
            <input type="number" id="pages" placeholder="Pages" required>
            <label>
                <input type="checkbox" id="read"> Read
            </label>
            <button type="submit">Add Book</button>
        </form>

        <!-- Display Library -->
        <div id="library"></div>
    </div>
    <script src="script.js"></script>
</body>
